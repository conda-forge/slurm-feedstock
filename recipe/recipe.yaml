schema_version: 1

context:
  version: "22.05.9"

package:
  name: slurm
  version: ${{ version }}

source:
  url: https://download.schedmd.com/slurm/slurm-${{ version }}.tar.bz2
  sha256: 0b732f293ca7ba226c21a58981dee37d668afdedad2fb2a485e8b3eff585d0d2

build:
  skip: not linux
  number: 3

requirements:
  build:
    - make
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
  host:
    - munge
    - mysql-devel
    - bzip2
    - libzlib
    - zstd
    - openssl
    - libcurl
    - krb5
    - keyutils
    - libedit
  run:
    - munge

tests:
  - package_contents:
      bin:
        - sacct
        - salloc
        - sprio
        - srun
        - sshare
        - sstat
        - strigger
  - script:
      - slurmd -h
      - slurmctld -h

about:
  homepage: https://slurm.schedmd.com/
  summary: cluster management and job scheduling system for Linux clusters
  license: GPL-2.0-only
  license_file: COPYING

extra:
  recipe-maintainers:
    - luizirber
    - msarahan
